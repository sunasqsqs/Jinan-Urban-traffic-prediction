<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>济南网约车 · 智能出行平台</title>

    <!-- DNS 预解析加速%20 routePermissionssetTimeou -->
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://webrd01.is.autonavi.com">

    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}

    <style id="anti-flash-style">
        html { background-color: #ffffff; }
        body { opacity: 0; visibility: hidden; transition: opacity 0.3s ease; }
    </style>

    <script>
        (function() {
            const currentPath = window.location.pathname;
            let currentUser = null;
            let tokenStr = localStorage.getItem('mamba_auth_token') || sessionStorage.getItem('mamba_auth_token');

            if (tokenStr) {
                try { currentUser = JSON.parse(tokenStr); } catch(e) {}
            }

            const role = currentUser ? currentUser.role : 'guest';
            const userType = currentUser ? (currentUser.user_type || 'passenger') : 'guest';

            const routePermissions = {
                '/': ['admin', 'super', 'normal', 'guest'],
                '/login': ['admin', 'super', 'normal', 'guest'],
                '/dashboard': ['admin', 'super', 'normal'],
                '/demand': ['admin', 'super', 'normal'],
                '/dispatch': ['admin', 'super'],
                '/driver': ['admin', 'super', 'normal'],
                '/passenger': ['admin', 'super', 'normal'],
                '/orders': ['admin', 'super', 'normal'],
                '/system': ['admin', 'super'],
                '/users': ['admin'],
                '/doc': ['admin', 'super', 'normal', 'guest'],
                '/about': ['admin', 'super', 'normal', 'guest']
            };

            if (routePermissions[currentPath]) {
                if (!routePermissions[currentPath].includes(role)) {
                    // 未登录用户只能看首页
                    window.location.replace('/');
                    return;
                }
            }

            window.addEventListener('DOMContentLoaded', () => {
                const styleTag = document.getElementById('anti-flash-style');
                if (styleTag) styleTag.remove();
                document.body.style.opacity = '1';
                document.body.style.visibility = 'visible';

                document.querySelectorAll('.nav-item').forEach(item => {
                    const reqRole = item.getAttribute('data-req-role');
                    const reqType = item.getAttribute('data-req-type');
                    if (!reqRole) return;
                    if (reqRole === 'admin' && role !== 'admin') { item.style.display = 'none'; return; }
                    if (reqRole === 'super' && role !== 'admin' && role !== 'super') { item.style.display = 'none'; return; }
                    if (reqRole === 'normal' && role === 'guest') { item.style.display = 'none'; return; }
                    if (reqType && role === 'normal' && userType !== reqType) { item.style.display = 'none'; }
                });
            });
        })();
    </script>

    <style>
        :root {
            --font-main: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-tech: "Segoe UI Mono", "Roboto Mono", monospace;
            --primary-bg: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.7);
            --border-color: rgba(0, 0, 0, 0.05);
            --text-main: #0f172a;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--primary-bg);
            color: var(--text-main);
            background-image: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #ffffff 80%);
        }

        .tech-font { font-family: var(--font-tech); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .nav-link { transition: all 0.3s; border-bottom: 2px solid transparent; color: #475569; }
        .nav-link:hover, .nav-link.active { color: #0891b2; border-bottom-color: #0891b2; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        @media (max-width: 640px) {
            .nav-link { font-size: 11px; padding: 0.25rem 0.5rem; }
            /* 移动端触摸友好：增大可点击区域 */
            button, .btn-touch, a.nav-item, [onclick] {
                min-height: 40px;
                min-width: 40px;
            }
            /* 移动端文字缩放 */
            h3 { font-size: 1.25rem !important; }
            /* 表格/卡片水平滚动容器 */
            .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

<nav class="border-b border-slate-200 bg-white/90 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 sm:h-20 flex justify-between items-center">

        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
            <div class="w-8 h-8 sm:w-10 sm:h-10 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
            </div>
            <div class="flex items-center gap-1.5 sm:gap-2.5">
                <a href="/" class="text-lg sm:text-2xl font-bold tracking-widest tech-font text-slate-900 hover:opacity-80 transition shrink-0">
                    济南市<span class="text-cyan-600">网约车</span>出行系统
                </a>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-4 lg:gap-6">
            <div class="hidden md:flex gap-2 lg:gap-4 xl:gap-6 tech-font text-xs lg:text-sm">
                <a href="/" class="nav-link py-1.5 {{ 'active' if request.path == '/' }}">首页</a>
                <a href="/dashboard" data-req-role="normal" class="nav-item nav-link py-1.5 {{ 'active' if request.path == '/dashboard' }}">离线看板</a>
                <a href="/demand" data-req-role="normal" class="nav-item nav-link py-1.5 {{ 'active' if request.path == '/demand' }}">需求预测</a>
                <a href="/dispatch" data-req-role="super" class="nav-item nav-link py-1.5 {{ 'active' if request.path == '/dispatch' }}">智能调度</a>
                <a href="/passenger" data-req-role="normal" data-req-type="passenger" class="nav-item nav-link py-1.5 {{ 'active' if request.path == '/passenger' }}" id="nav-passenger">打车</a>
                <a href="/driver" data-req-role="normal" data-req-type="driver" class="nav-item nav-link py-1.5 {{ 'active' if request.path == '/driver' }}" id="nav-driver">接单</a>
                <a href="/orders" data-req-role="normal" class="nav-item nav-link py-1.5 {{ 'active' if request.path == '/orders' }}">我的行程</a>
                <a href="/system" data-req-role="super" class="nav-item nav-link py-1.5 {{ 'active' if request.path == '/system' }}">系统架构</a>
                <a href="/users" data-req-role="admin" class="nav-item nav-link py-1.5 {{ 'active' if request.path == '/users' }}">用户管理</a>
            </div>

            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                <div id="user-role-badge" class="hidden px-2 sm:px-3 py-1 rounded border text-[10px] sm:text-xs font-mono"></div>
                <a href="/login" id="nav-login-btn" class="px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg border border-cyan-600 text-cyan-600 hover:bg-cyan-600 hover:text-white transition text-xs sm:text-sm font-bold tech-font tracking-widest">登录</a>
            </div>
        </div>

        <!-- 移动端汉堡菜单 -->
        <div class="md:hidden flex items-center">
            <button id="mobile-menu-btn" class="p-2 text-slate-600" onclick="toggleMobileMenu()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- 移动端下拉菜单 -->
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-slate-200 px-4 py-3 space-y-1 shadow-lg">
        <a href="/" class="nav-item block py-3 px-3 text-sm font-bold text-slate-700 rounded-lg hover:bg-slate-50 active:bg-slate-100">首页</a>
        <a href="/dashboard" data-req-role="normal" class="nav-item block py-3 px-3 text-sm font-bold text-slate-700 rounded-lg hover:bg-slate-50 active:bg-slate-100">离线看板</a>
        <a href="/demand" data-req-role="normal" class="nav-item block py-3 px-3 text-sm font-bold text-slate-700 rounded-lg hover:bg-slate-50 active:bg-slate-100">需求预测</a>
        <a href="/dispatch" data-req-role="super" class="nav-item block py-3 px-3 text-sm font-bold text-slate-700 rounded-lg hover:bg-slate-50 active:bg-slate-100">智能调度</a>
        <a href="/passenger" data-req-role="normal" data-req-type="passenger" class="nav-item block py-3 px-3 text-sm font-bold text-slate-700 rounded-lg hover:bg-slate-50 active:bg-slate-100">打车</a>
        <a href="/driver" data-req-role="normal" data-req-type="driver" class="nav-item block py-3 px-3 text-sm font-bold text-slate-700 rounded-lg hover:bg-slate-50 active:bg-slate-100">接单</a>
        <a href="/orders" data-req-role="normal" class="nav-item block py-3 px-3 text-sm font-bold text-slate-700 rounded-lg hover:bg-slate-50 active:bg-slate-100">我的行程</a>
        <a href="/system" data-req-role="super" class="nav-item block py-3 px-3 text-sm font-bold text-slate-700 rounded-lg hover:bg-slate-50 active:bg-slate-100">系统架构</a>
        <a href="/users" data-req-role="admin" class="nav-item block py-3 px-3 text-sm font-bold text-slate-700 rounded-lg hover:bg-slate-50 active:bg-slate-100">用户管理</a>
    </div>
</nav>

<main class="flex-1 max-w-7xl mx-auto px-2 sm:px-4 lg:px-6 py-3 sm:py-6 lg:py-8 w-full">
    {% block content %}{% endblock %}
</main>

<footer class="border-t border-slate-200 bg-white relative overflow-hidden mt-6 sm:mt-10">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-2/3 h-[1px] bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-6 sm:pt-10 pb-4 sm:pb-6">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">
            <div class="text-xs text-slate-400 font-mono">
                &copy; 2026 济南智能出行平台 · 鲁A网约车
            </div>
            <div class="flex gap-4 sm:gap-6 text-xs">
                <a href="/doc" class="text-slate-400 hover:text-cyan-600 transition">使用文档</a>
                <a href="/about" class="text-slate-400 hover:text-cyan-600 transition">关于我们</a>
            </div>
        </div>
    </div>
</footer>

<script>
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    }

    document.addEventListener("DOMContentLoaded", function() {
        let tokenStr = localStorage.getItem('mamba_auth_token') || sessionStorage.getItem('mamba_auth_token');
        const loginBtn = document.getElementById('nav-login-btn');
        const roleBadge = document.getElementById('user-role-badge');

        if (loginBtn && tokenStr) {
            try {
                const user = JSON.parse(tokenStr);
                roleBadge.style.display = 'block';

                const userType = user.user_type || 'passenger';
                const typeLabel = userType === 'driver' ? '司机' : '乘客';

                if(user.role === 'admin') {
                    roleBadge.className = 'px-2 sm:px-3 py-1 rounded bg-red-50 border border-red-200 text-red-600 text-[10px] sm:text-xs font-mono font-bold';
                    roleBadge.innerText = '管理员';
                } else if(user.role === 'super') {
                    roleBadge.className = 'px-2 sm:px-3 py-1 rounded bg-purple-50 border border-purple-200 text-purple-600 text-[10px] sm:text-xs font-mono font-bold';
                    roleBadge.innerText = '高级会员';
                } else {
                    roleBadge.className = 'px-2 sm:px-3 py-1 rounded bg-blue-50 border border-blue-200 text-blue-600 text-[10px] sm:text-xs font-mono font-bold';
                    roleBadge.innerText = typeLabel;
                }

                loginBtn.innerText = '退出';
                loginBtn.classList.remove('border-cyan-600', 'text-cyan-600');
                loginBtn.classList.add('border-slate-300', 'text-slate-500', 'hover:bg-red-500', 'hover:text-white', 'hover:border-red-500');
                loginBtn.href = '#';
                loginBtn.onclick = function(e) {
                    e.preventDefault();
                    localStorage.removeItem('mamba_auth_token');
                    sessionStorage.removeItem('mamba_auth_token');
                    window.location.replace('/');
                };
            } catch(e) {}
        }
    });
</script>
</body>
</html>
