<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamba-GNN 网约车需求预测系统</title>

    <!-- 载入 Tailwind CSS 与 Chart.js 核心库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 防闪烁白底遮罩样式 -->
    <style id="anti-flash-style">
        html { background-color: #ffffff; }
        body { opacity: 0; visibility: hidden; transition: opacity 0.3s ease; }
    </style>

    <!-- 动态路由与角色访问控制权限拦截器 -->
    <script>
        (function() {
            const currentPath = window.location.pathname;
            let currentUser = null;
            let tokenStr = localStorage.getItem('mamba_auth_token') || sessionStorage.getItem('mamba_auth_token');

            if (tokenStr) {
                try { currentUser = JSON.parse(tokenStr); } catch(e) {}
            }

            const role = currentUser ? currentUser.role : 'guest';

            // 注册与鉴权路由映射表
            const routePermissions = {
                '/': ['admin', 'super', 'normal', 'guest'],
                '/login': ['admin', 'super', 'normal', 'guest'],
                '/dashboard': ['admin', 'super', 'normal'],
                '/demand': ['admin', 'super', 'normal'],
                '/dispatch': ['admin', 'super'], // [权限点] 智能调度功能全局开放
                '/taxi': ['admin', 'super', 'normal'],
                '/orders': ['admin', 'super', 'normal'],
                '/system': ['admin', 'super'],
                '/users': ['admin'],
                '/doc': ['admin', 'super', 'normal', 'guest'],
                '/about': ['admin', 'super', 'normal', 'guest']
            };

            if (routePermissions[currentPath]) {
                if (!routePermissions[currentPath].includes(role)) {
                    if (role === 'guest') {
                        window.location.replace('/login');
                    } else {
                        window.location.replace('/demand');
                    }
                    return;
                }
            }

            window.addEventListener('DOMContentLoaded', () => {
                const styleTag = document.getElementById('anti-flash-style');
                if (styleTag) styleTag.remove();
                document.body.style.opacity = '1';
                document.body.style.visibility = 'visible';

                document.querySelectorAll('.nav-item').forEach(item => {
                    const reqRole = item.getAttribute('data-req-role');
                    if (!reqRole) return;
                    if (reqRole === 'admin' && role !== 'admin') item.style.display = 'none';
                    if (reqRole === 'super' && role !== 'admin' && role !== 'super') item.style.display = 'none';
                    if (reqRole === 'normal' && role === 'guest') item.style.display = 'none';
                });
            });
        })();
    </script>

    <!-- 核心美化设计样式 -->
    <style>
        :root {
            --font-main: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-tech: "Segoe UI Mono", "Roboto Mono", monospace;
            --primary-bg: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.7);
            --border-color: rgba(0, 0, 0, 0.05);
            --text-main: #0f172a;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--primary-bg);
            color: var(--text-main);
            background-image: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #ffffff 80%);
        }

        .tech-font { font-family: var(--font-tech); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .nav-link { transition: all 0.3s; border-bottom: 2px solid transparent; color: #475569; }
        .nav-link:hover, .nav-link.active { color: #0891b2; border-bottom-color: #0891b2; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

<!-- 顶部导航栏区域 -->
<nav class="border-b border-slate-200 bg-white/90 backdrop-blur-md sticky top-0 z-50 animate-fadeIn">
    <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">

        <!-- 响应式自适应新型 Logo 组合区 -->
        <div class="flex items-center gap-3 shrink-0">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center shrink-0">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
            </div>
            <div class="flex items-center gap-2.5">
                <a href="/" class="text-2xl font-bold tracking-widest tech-font text-slate-900 hover:opacity-80 transition shrink-0">
                    MAMBA<span class="text-cyan-600">GNN</span>
                </a>
                <span class="h-5 w-[1px] bg-slate-300 hidden xl:block shrink-0"></span>
                <span class="text-sm font-semibold text-slate-500 tracking-wider hidden xl:block shrink-0 font-sans">
                    济南市网约车需求预测系统
                </span>
            </div>
        </div>

        <!-- 导航与控制区域 -->
        <div class="flex items-center gap-4 lg:gap-6 xl:gap-8">
            <div class="hidden lg:flex gap-4 xl:gap-6 tech-font text-sm">
                <a href="/" class="nav-link py-2 {{ 'active' if request.path == '/' }}">首页</a>
                <a href="/dashboard" data-req-role="normal" class="nav-item nav-link py-2 {{ 'active' if request.path == '/dashboard' }}">离线看板</a>
                <a href="/demand" data-req-role="normal" class="nav-item nav-link py-2 {{ 'active' if request.path == '/demand' }}">需求预测</a>
                <a href="/dispatch" data-req-role="super" class="nav-item nav-link py-2 {{ 'active' if request.path == '/dispatch' }}">智能调度</a>
                <a href="/taxi" data-req-role="normal" class="nav-item nav-link py-2 {{ 'active' if request.path == '/taxi' }}">模拟接单</a>
                <a href="/orders" data-req-role="normal" class="nav-item nav-link py-2 {{ 'active' if request.path == '/orders' }}">我的行程</a>
                <a href="/system" data-req-role="super" class="nav-item nav-link py-2 {{ 'active' if request.path == '/system' }}">系统架构</a>
                <a href="/users" data-req-role="admin" class="nav-item nav-link py-2 {{ 'active' if request.path == '/users' }}">用户管理</a>
            </div>

            <!-- 用户状态区 -->
            <div class="flex items-center gap-3 shrink-0">
                <div id="user-role-badge" class="hidden px-3 py-1 rounded border text-xs font-mono"></div>
                <a href="/login" id="nav-login-btn" class="px-5 py-2 rounded-lg border border-cyan-600 text-cyan-600 hover:bg-cyan-600 hover:text-white transition text-sm font-bold tech-font tracking-widest">登录系统</a>
            </div>
        </div>
    </div>
</nav>

<!-- 主页面插槽 -->
<main class="flex-1 max-w-7xl mx-auto px-6 py-8 w-full">
    {% block content %}{% endblock %}
</main>

<!-- 页脚区域 -->
<footer class="border-t border-slate-200 bg-white relative overflow-hidden mt-10">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-2/3 h-[1px] bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent"></div>

    <div class="max-w-7xl mx-auto px-6 pt-10 pb-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-center">
            <div>
                <h4 class="text-slate-900 font-bold tech-font tracking-widest text-lg flex items-center gap-2">
                    <div class="w-2 h-2 bg-cyan-500 rounded-full animate-pulse"></div>
                    MAMBA INTELLIGENCE
                </h4>
            </div>

            <div class="flex justify-center gap-8 border-x border-slate-100 px-4">
                <div class="text-center">
                    <div class="text-xs text-slate-400 font-mono uppercase mb-1 tracking-wider">CUDA版本</div>
                    <div class="text-cyan-600 font-bold font-mono">12.8</div>
                </div>
                <div class="text-center">
                    <div class="text-xs text-slate-400 font-mono uppercase mb-1 tracking-wider">Mamba版本</div>
                    <div class="text-emerald-600 font-bold font-mono">2.2.2</div>
                </div>
                <div class="text-center">
                    <div class="text-xs text-slate-400 font-mono uppercase mb-1 tracking-wider">GNN类别</div>
                    <div class="text-purple-600 font-bold font-mono">GCN</div>
                </div>
            </div>

            <div class="text-right">
                <p class="text-slate-500 text-xs font-mono mb-3">
                    &copy; 2026 INTELLIGENT TRAFFIC LAB. <br>
                    ALL RIGHTS RESERVED.
                </p>
                <div class="flex justify-end gap-6">
                    <a href="/doc" class="text-slate-400 hover:text-cyan-600 text-xs transition border-b border-transparent hover:border-cyan-600 pb-0.5">使用文档</a>
                    <a href="/about" class="text-slate-400 hover:text-cyan-600 text-xs transition border-b border-transparent hover:border-cyan-600 pb-0.5">关于我们</a>
                </div>
            </div>
        </div>
    </div>
</footer>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let tokenStr = localStorage.getItem('mamba_auth_token') || sessionStorage.getItem('mamba_auth_token');
        const loginBtn = document.getElementById('nav-login-btn');
        const roleBadge = document.getElementById('user-role-badge');

        if (loginBtn && tokenStr) {
            try {
                const user = JSON.parse(tokenStr);
                roleBadge.style.display = 'block';

                if(user.role === 'admin') {
                    roleBadge.className = 'px-3 py-1 rounded bg-red-50 border border-red-200 text-red-600 text-xs font-mono font-bold';
                    roleBadge.innerText = '管理员 (ADMIN)';
                } else if(user.role === 'super') {
                    roleBadge.className = 'px-3 py-1 rounded bg-purple-50 border border-purple-200 text-purple-600 text-xs font-mono font-bold';
                    roleBadge.innerText = '高级会员 (SUPER)';
                } else {
                    roleBadge.className = 'px-3 py-1 rounded bg-blue-50 border border-blue-200 text-blue-600 text-xs font-mono font-bold';
                    roleBadge.innerText = '普通用户';
                }

                loginBtn.innerText = '退出系统';
                loginBtn.classList.remove('border-cyan-600', 'text-cyan-600');
                loginBtn.classList.add('border-slate-300', 'text-slate-500', 'hover:bg-red-500', 'hover:text-white', 'hover:border-red-500');
                loginBtn.href = '#';
                loginBtn.onclick = function(e) {
                    e.preventDefault();
                    localStorage.removeItem('mamba_auth_token');
                    sessionStorage.removeItem('mamba_auth_token');
                    window.location.replace('/');
                };
            } catch(e) {}
        }
    });
</script>
</body>
</html>
