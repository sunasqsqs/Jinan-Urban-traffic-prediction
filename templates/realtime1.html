                MAMBA-GNN REAL-TIME FORECASTING

            <h3 class="text-3xl font-bold text-slate-800 tech-font mb-2">城市出行需求实时预测与监控</h3>

        <div class="flex gap-6 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">

                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">全局预测 R²</div>

            </div>
            <div class="w-px bg-slate-100"></div>

            </div>
            <div class="p-6 flex-grow min-h-[350px] relative">

        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <h4 class="font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="flame" class="w-5 h-5 text-rose-500"></i> 极度高需预警区域 (Top 5)

                <span class="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded font-bold border border-rose-200">LIVE</span>

            <div class="p-4 flex-grow overflow-y-auto bg-slate-50/50 space-y-3" id="hotspot-container">

</div>

<style>
    @media (max-width: 640px) {
        .min-h-\[350px\] { min-height: 260px !important; }
        h3.text-3xl { font-size: 1.25rem !important; }
        .text-2xl { font-size: 1.25rem !important; }
        .bg-white.rounded-2xl .px-6 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
        .bg-white.rounded-2xl .p-6 { padding: 0.75rem !important; }
    }
</style>

<script>
    let cityChart = new Chart(document.getElementById('cityDemandChart'), {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: '真实需求', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.4, borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4 },
                { label: 'AI 模型预测', data: [], borderColor: '#f59e0b', borderDash: [5, 5], tension: 0.4, borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            scales: {
                x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } },
                y: { beginAtZero: true, suggestedMax: 6800, grid: { color: '#f1f5f9' } }
            },
            plugins: { legend: { display: false } }
        }
    });

    // 为热门网格赋予真实业务名称 (硬编码，避免任何 Jinja 渲染风险)
    const GRID_NAMES = {
        82: "泉城广场及市中心",
        83: "省博物馆及CBD区域",
        81: "趵突泉景区",
        84: "奥体中心",
        86: "百脉泉公园"
    };

    function startRealTimeSimulation() {
        const metrics = injectedData.evaluation_groups.Mamba_GNN_Single['Mamba-GNN'];
        document.getElementById('global-r2').innerText = (parseFloat(metrics.r2) * 100).toFixed(2) + '%';
        document.getElementById('global-mae').innerText = metrics.mae;

        const trueVals = injectedData.predictions_time_series.ground_truth;
        const predVals = injectedData.predictions_time_series.prediction_mamba_gnn;
        const topRegions = injectedData.top_predicted_regions_analysis;

        const totalSteps = trueVals.length;
        const windowSize = 25; // 滑窗宽度

        // 将渲染逻辑单独抽出为复用函数 (1时间步 = 1真实秒)
        const renderStep = () => {
            const nowMs = Date.now();
            // 所有分页统一使用系统时间计算绝对进度 tick
            const absoluteTick = Math.floor(nowMs / 1000) % totalSteps;

            const displayLabels = [];
            const displayTrue = [];
            const displayPred = [];

            // 生成滑动视窗数据及对应的绝对真实时间标签
            for (let i = 0; i < windowSize; i++) {
                // 环形取模，确保滑动窗口的数据能连续衔接 (不报错 undefined)
                let idx = (absoluteTick - windowSize + 1 + i) % totalSteps;
                if (idx < 0) idx += totalSteps;

                displayTrue.push(trueVals[idx]);
                displayPred.push(predVals[idx]);

                // 横轴时间按照系统时间：最后一个点是当前时间，前面的点依次减去 1 秒
                const offsetMs = (windowSize - 1 - i) * 1000;
                const t = new Date(nowMs - offsetMs);

                displayLabels.push(
                    t.getHours().toString().padStart(2, '0') + ':' +
                    t.getMinutes().toString().padStart(2, '0') + ':' +
                    t.getSeconds().toString().padStart(2, '0')
                );
            }

            cityChart.data.labels = displayLabels;
            cityChart.data.datasets[0].data = displayTrue;
            cityChart.data.datasets[1].data = displayPred;
            cityChart.update('none');

            // 提取最新一个点的时间作为右上角的大盘时间
            const latestLabel = displayLabels[displayLabels.length - 1];
            document.getElementById('time-step').innerHTML = `<span class="text-slate-500 font-normal">同步系统时间：</span>${latestLabel} <span class="ml-2 bg-indigo-50 text-indigo-500 px-1.5 py-0.5 rounded text-[10px]">T+${absoluteTick + 1}</span>`;

            renderHotspots(topRegions, absoluteTick);
        };

        // 1. 立即执行一次渲染
        renderStep();

        // 2. 挂载循环定时器 (1000毫秒 = 1秒)
        setInterval(renderStep, 1000);
    }

    function renderHotspots(regions, timeIndex) {
        const container = document.getElementById('hotspot-container');
        container.innerHTML = '';

        regions.forEach((region, i) => {
            const currentTrue = region.time_series_data.true_values[timeIndex] || 0;
            const currentPred = region.time_series_data.predicted_values[timeIndex] || 0;
            const spotName = GRID_NAMES[region.grid_id] || `Grid ${region.grid_id}`;

            // 计算压力比 (以 3000 单为参考基准上限)
            const pressureRatio = Math.min(100, (currentPred / 3000) * 100);
            const isHighPressure = pressureRatio > 80;

            const card = document.createElement('div');
            card.className = `bg-white p-4 rounded-xl border ${isHighPressure ? 'border-rose-300 shadow-md' : 'border-slate-100 shadow-sm'} relative overflow-hidden transition-all duration-300 hover:shadow-md hover:border-blue-200`;

            card.innerHTML = `
                <div class="flex justify-between items-start mb-1.5">
                    <h5 class="font-bold text-slate-800 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full ${isHighPressure ? 'bg-rose-500 animate-pulse' : 'bg-emerald-500'}"></span>
                        ${spotName}
                    </h5>
                    <span class="bg-rose-50 text-rose-600 text-[10px] font-black px-2 py-0.5 rounded border border-rose-100 flex items-center gap-1">
                        TOP ${i + 1}
                    </span>
                </div>
                <div class="text-[10px] text-slate-400 mb-3 font-mono">网格坐标: [${region.lon_center}, ${region.lat_center}] | GridID: ${region.grid_id}</div>
                <div class="flex items-center justify-between mt-1">
                    <div>
                        <div class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">即时预测呼叫量</div>
                        <div class="text-2xl font-black ${isHighPressure ? 'text-rose-600' : 'text-slate-800'} font-mono">${Math.round(currentPred)} <span class="text-xs text-slate-400 font-normal">单</span></div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">实际产生</div>
                        <div class="text-lg font-bold text-slate-500 font-mono">${Math.round(currentTrue)}</div>
                    </div>
                </div>
                <div class="mt-3.5 h-1.5 w-full bg-slate-100 rounded-full overflow-hidden flex">
                    <div class="h-full rounded-full transition-all duration-500 ${isHighPressure ? 'bg-gradient-to-r from-rose-400 to-rose-600' : 'bg-gradient-to-r from-blue-400 to-indigo-500'}" style="width: ${pressureRatio}%"></div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 初始化：数据已固化为 injectedData，直接启动模拟
    document.addEventListener("DOMContentLoaded", () => {
        startRealTimeSimulation();
    });
</script>
{% endblock %}
