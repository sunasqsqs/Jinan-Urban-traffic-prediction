{% extends "base.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[75vh] text-center relative w-full pt-10">
    <!-- 明亮主题的背景光晕 -->
    <div class="absolute w-[500px] h-[500px] bg-blue-100/50 rounded-full blur-[100px] -z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
    <div class="absolute w-[400px] h-[400px] bg-indigo-100/50 rounded-full blur-[80px] -z-10 top-1/4 left-1/4 pointer-events-none"></div>

    <div class="mb-6 inline-block px-4 py-1.5 rounded-full border border-blue-200 bg-blue-50 text-blue-600 text-xs font-mono tracking-widest shadow-sm">
        SYSTEM V3.0.0 · JINAN CITY LONG-TERM DATASET
    </div>

    <h1 class="text-5xl md:text-7xl font-bold text-gray-800 tracking-wider tech-font mb-6 drop-shadow-sm">
        MAMBA<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-500">GNN</span>
    </h1>

    <p class="text-lg md:text-xl text-gray-500 max-w-2xl leading-relaxed mb-12">
        基于<span class="text-blue-600 font-semibold mx-1">状态空间模型</span>与<span class="text-indigo-500 font-semibold mx-1">图神经网络</span>的新一代预测引擎。<br>
        打造秒级响应的城市交通大脑。
    </p>

    <div id="home-action-container" class="flex flex-wrap justify-center gap-5 mb-20 min-h-[60px]">
        <!-- 按钮由 JS 动态渲染 -->
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pt-10 border-t border-gray-200 w-full max-w-4xl relative z-10">
        <div class="bg-white/80 backdrop-blur border border-gray-100 shadow-sm p-8 rounded-2xl transition hover:shadow-md hover:-translate-y-1">
            <div class="text-4xl font-bold text-gray-800 mb-2 tech-font">O(L)</div>
            <div class="text-sm text-gray-500 font-medium">线性计算复杂度</div>
        </div>
        <div class="bg-white/80 backdrop-blur border border-gray-100 shadow-sm p-8 rounded-2xl transition hover:shadow-md hover:-translate-y-1">
            <div class="text-4xl font-bold text-blue-600 mb-2 tech-font" id="index-r2">99.07%</div>
            <div class="text-sm text-gray-500 font-medium">决定系数 (R²)</div>
        </div>
        <div class="bg-white/80 backdrop-blur border border-gray-100 shadow-sm p-8 rounded-2xl transition hover:shadow-md hover:-translate-y-1">
            <div class="text-4xl font-bold text-indigo-500 mb-2 tech-font">Fast</div>
            <div class="text-sm text-gray-500 font-medium">高并发秒级推理</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById('home-action-container');
        let currentUser = null;
        const tokenStr = localStorage.getItem('mamba_auth_token');

        try {
            if (tokenStr && tokenStr.startsWith('{')) {
                currentUser = JSON.parse(tokenStr);
            }
        } catch(e) { console.error("解析 Token 失败"); }

        const btnTemplate = (href, label, icon) => {
            const baseClass = "px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold transition shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 transform hover:-translate-y-0.5 flex items-center gap-2 text-sm";
            return `<a href="${href}" class="${baseClass}"><i data-lucide="${icon}" class="w-4.5 h-4.5"></i>${label}</a>`;
        };

        let html = "";
        if (!currentUser) {
            html = btnTemplate('/login', '验证身份进入系统', 'shield-check');
        } else {
            const role = currentUser.role;
            const userType = currentUser.user_type || 'passenger';

            // 入口顺序与导航栏一致
            html += btnTemplate('/dashboard', '离线综合看板', 'layout-dashboard');
            html += btnTemplate('/demand', '全域需求预测', 'bar-chart-2');

            if (role === 'admin' || role === 'super') {
                html += btnTemplate('/dispatch', '智能调度', 'navigation');
            }

            // 打车 & 接单：管理员/高级会员两个都显示，普通用户按身份显示
            if (role === 'admin' || role === 'super' || userType === 'passenger') {
                html += btnTemplate('/passenger', '🚕 立即打车', 'map-pin');
            }
            if (role === 'admin' || role === 'super' || userType === 'driver') {
                html += btnTemplate('/driver', '🚕 开始接单', 'car');
            }

            html += btnTemplate('/orders', '我的行程', 'calendar');

            if (role === 'admin' || role === 'super') {
                html += btnTemplate('/system', '系统架构', 'component');
            }

            if (role === 'admin') {
                html += btnTemplate('/users', '用户管理', 'users');
            }
        }

        container.innerHTML = html;
        if (window.lucide) lucide.createIcons();

        if (!(window.location.protocol.startsWith('file') || window.location.protocol.startsWith('blob'))) {
            fetch('/api/data').then(r => r.json()).then(data => {
                const r2Value = data.evaluation_groups.Fusion_Comparison['Mamba-GNN'].r2;
                document.getElementById('index-r2').textContent = (parseFloat(r2Value.split('±')[0]) * 100).toFixed(2) + '%';
            }).catch(() => {});
        }
    });
</script>
{% endblock %}
